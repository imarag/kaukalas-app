<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <link rel="stylesheet" href="../../dist/style.css" />
  </head>
  <body>
    <header>
      <nav class="flex flex-row items-center p-8 h-20 bg-transparent">
        <a href="index.html" class="text-xl font-bold">PoolClean</a>
        <ul
          class="flex flex-col items-center text-center bg-base-200 sm:bg-transparent justify-center sm:justify-start gap-4 ms-12 fixed sm:static sm:flex-row right-0 top-20 bottom-0 w-0 sm:w-full overflow-hidden"
          id="main-nav"
        >
          <li class="p-2 hover:bg-base-300 hover:text-base-content rounded-lg">
            <a class="no-underline" href="index.html">Home</a>
          </li>
          <li class="p-2 hover:bg-base-300 hover:text-base-content rounded-lg">
            <a class="no-underline" href="about.html">About</a>
          </li>
          <li class="p-2 hover:bg-base-300 hover:text-base-content rounded-lg">
            <a class="no-underline" href="services.html">Services</a>
          </li>
          <li class="p-2 hover:bg-base-300 hover:text-base-content rounded-lg">
            <a class="no-underline" href="gallery.html">Gallery</a>
          </li>
          <li class="p-2 hover:bg-base-300 hover:text-base-content rounded-lg">
            <a class="no-underline" href="contact.html">Contact</a>
          </li>
        </ul>
        <div id="theme-container" class="ms-auto">
          <label class="flex items-center cursor-pointer gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="size-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="5" />
              <path
                d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
              />
            </svg>
            <input
              type="checkbox"
              value="synthwave"
              class="toggle theme-controller"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              class="size-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </label>
        </div>
        <button
          id="burger-button"
          class="btn btn-md btn-ghost btn-square sm:hidden ms-auto"
        >
          <svg
            class="size-8"
            viewBox="0 0 24 24"
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5 12H18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M5 17H11"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M5 7H15"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </nav>
    </header>
    <main>
      <section
        class="bg-hero-image bg-no-repeat bg-cover h-screen min-h-96 flex items-center justify-center"
      >
        <div>
          <h1
            class="text-base-100 text-7xl lg:text-8xl xl:text-9xl font-bold text-center"
          >
            GK Pool & Villas<br />Services
          </h1>
          <p
            class="text-base-300 text-4xl mt-6 drop-shadow-2xl font-semibold"
            id="hero-subtitle"
          >
            Επαγγελματικός Καθαρισμός Πισίνας, Εύκολα και Γρήγορα
          </p>
          <p
            class="text-base-300 text-3xl mt-6 drop-shadow-2xl font-semibold text-center"
            id="hero-subtitle"
            data-lang="en"
          >
            Professional Pool Cleaning, Easy and Fast
          </p>
          <div
            class="w-3/4 mx-auto mt-20 flex flex-col sm:flex-row items-stretch justify-center gap-y-5 gap-x-6"
          >
            <a href="/contact.html" class="btn btn-primary" id="hero-cta-1"
              >Κλείστε ραντεβού</a
            >
            <a
              href="/services.html"
              class="btn btn-primary btn-outline"
              id="hero-cta-2"
              >Μάθετε περισσότερα</a
            >
          </div>
        </div>
      </section>
      <section class="py-20 container mx-auto">
        <h2
          class="text-4xl font-bold text-center mb-4"
          id="services-title"
        ></h2>
        <p class="text-lg text-center mb-12" id="services-subtitle"></p>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="services-grid">
          <!-- Dynamic service cards will be inserted here -->
        </div>
        <div class="text-center mt-16">
          <a
            href="/services"
            class="btn btn-outline-secondary"
            id="services-more-btn"
          ></a>
        </div>
      </section>
      <section class="py-20 container mx-auto">
        <h2 class="text-4xl font-bold text-center mb-4" id="gallery-title"></h2>
        <p class="text-lg text-center mb-12" id="gallery-subtitle"></p>
        <div class="text-center my-16">
          <a
            href="/gallery"
            class="btn btn-outline-secondary"
            id="gallery-btn"
          ></a>
        </div>
        <div class="grid grid-cols-2 gap-2 md:gap-6" id="gallery-grid">
          <!-- Dynamic gallery images will be inserted here -->
        </div>
      </section>
      <section class="py-20 container mx-auto text-center">
        <p
          class="w-full md:w-3/4 lg:w-1/2 mx-auto text-2xl font-semibold mb-5"
          id="cta-text"
        ></p>
        <h2 class="text-4xl font-bold mb-4" id="cta-title"></h2>
        <p class="text-lg mb-12" id="cta-subtitle"></p>
        <div class="my-16">
          <a href="/contact" class="btn btn-outline-secondary" id="cta-btn"></a>
        </div>
        <div>
          <img
            class="w-full h-full object-cover"
            src="../images/cta-image.png"
            alt="Contact us for pool cleaning services"
          />
        </div>
      </section>
    </main>
    <footer></footer>
    <script src="../js/main.js"></script>
  </body>
</html>
